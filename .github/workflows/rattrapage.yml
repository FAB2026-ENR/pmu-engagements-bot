name: Rattrapage infos (ponctuel)

# Se lance uniquement à la main : onglet Actions > ce workflow > Run workflow.
# Récupère le type de course et les infos des chevaux du 02/10 au 08/10
# et les range dans data/rattrapage/ (les bilans existants ne sont pas modifiés).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les infos du 02/10 au 08/10
        timeout-minutes: 20
        run: python scripts/rattrapage.py

      - name: Enregistrer
        run: |
          git config user.name "pmu-engagements-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rattrapage/
          git diff --staged --quiet && exit 0
          git commit -m "Rattrapage infos course et cheval 02/10 → 08/10"
          git pull --rebase
          git push
