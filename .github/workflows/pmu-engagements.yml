yaml
name: Récupération engagements PMU (galop)

on:
  schedule:
    - cron: '*/30 6-19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer le programme et calculer les meilleurs engagements
        run: python scripts/fetch_pmu.py

      - name: Commit et push si changement
        run: |
          git config user.name "pmu-engagements-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour engagements $(date -u +%Y-%m-%d\ %H:%M)"
          git push
