name: Récupération engagements PMU (galop)

on:
  schedule:
    # Toutes les 30 min entre 6h et 19h UTC ≈ 8h-21h Paris (couvre l'essentiel
    # des réunions + les éventuelles mises à jour de déclarations/partants).
    - cron: '*/30 6-19 * * *'
    # Message Telegram du matin : 6h45 UTC (8h45 Paris en été / 7h45 en hiver).
    - cron: '45 6 * * *'
    # Bilan du soir, une fois les réunions de galop terminées : 21h30 UTC
    # (23h30 Paris en été / 22h30 en hiver) — volontairement tardif pour
    # laisser le temps aux rapports définitifs d'être publiés par le PMU.
    - cron: '30 21 * * *'
  workflow_dispatch:  # lancement manuel depuis l'onglet Actions
    inputs:
      envoi:
        description: "Envoi Telegram à tester"
        type: choice
        default: aucun
        options:
          - aucun
          - matin
          - bilan

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer le programme et calculer les meilleurs engagements
        run: python scripts/fetch_pmu.py

      - name: Construire le bilan du soir (arrivées + cotes)
        # Seulement sur le créneau du soir (ou un lancement manuel, pratique
        # pour tester) — pas à chaque passage de la journée, pour éviter
        # d'écraser le bilan avec des résultats partiels avant la fin des
        # réunions.
        if: github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_bilan.py

      - name: Telegram — meilleurs engagements du matin
        if: github.event.schedule == '45 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.envoi == 'matin')
        run: python scripts/notify_telegram.py morning

      - name: Telegram — bilan du soir
        if: github.event.schedule == '30 21 * * *' || (github.event_name == 'workflow_dispatch' && inputs.envoi == 'bilan')
        run: python scripts/notify_telegram.py bilan

      - name: Commit et push si changement
        run: |
          git config user.name "pmu-engagements-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour engagements $(date -u +%Y-%m-%d\ %H:%M)"
          git push
